# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → выберите репозиторий. Пароль администратора Render сгенерирует сам
# (посмотреть: Dashboard → сервис → Environment → ADMIN_PASSWORD).
services:
  - type: web
    name: tropy-bez-barierov
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_PASSWORD
        generateValue: true
      # На бесплатном тарифе диск временный: база пересоздаётся при каждом перезапуске.
      # Для постоянного хранения подключите диск (disk) и укажите путь к базе на нём:
      # - key: DB_FILE
      #   value: /var/data/tropy.db
